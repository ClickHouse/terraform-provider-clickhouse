name: Release Notes

on:
  # No push-tag trigger — release.yaml's trigger-release-notes job dispatches
  # this workflow explicitly instead (see its comment for why).
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: "The tag to generate release notes for (e.g. v1.2.3 or v1.2.3-beta1)"

defaults:
  run:
    shell: bash

jobs:
  release-notes:
    permissions:
      contents: write
      pull-requests: read
    runs-on: k8s-medium
    steps:
      - name: Wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          for i in $(seq 1 30); do
            if gh release view "$tag" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
              echo "Draft release is ready"
              exit 0
            fi
            echo "Attempt $i: draft not ready, waiting 20s..."
            sleep 20
          done
          echo "Timed out waiting for draft release"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Build release notes from PR changelog entries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # GoReleaser has already populated the draft with the commit list;
          # keep it below the entries collected from the PR descriptions.
          {
            python3 .github/scripts/changelog.py release-notes "$tag"
            echo
            echo "---"
            echo
            gh release view "$tag" --json body --jq '.body'
          } > /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Update draft release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ inputs.tag || github.ref_name }} \
            --repo ${{ github.repository }} \
            --notes-file /tmp/release-notes.md
