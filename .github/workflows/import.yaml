name: Test import

on:
  workflow_dispatch:
    inputs:
      api_env:
        type: choice
        default: Production
        options:
          - Production
          - Staging
          - Development
          - Custom
        description: What API ENV to use as backend.
      api_url:
        type: string
        default: ""
        description: (Optional) Full URL of the API service to use when API Env is 'Custom'
      organization_id:
        type: string
        default: ""
        description: (Optional) Organization ID to use when API Env is 'Custom'
      api_key_id:
        type: string
        default: ""
        description: (Optional) API Key ID to use when API Env is 'Custom'
      api_key_secret:
        type: string
        default: ""
        description: (Optional) API Key secret to use when API Env is 'Custom'

defaults:
  run:
    shell: bash

jobs:
  # Generate a random token to tag the tests with
  token:
    outputs:
      token: ${{ steps.generate.outputs.token }}
    runs-on: k8s-nano
    steps:
      - name: Generate
        id: generate
        run: |
          token="$(date '+%s')"
          echo "token=${token}" >> $GITHUB_OUTPUT

  # Find the most recent releases of terraform CLI
  find-tf-releases:
    outputs:
      releases: ${{ steps.find.outputs.releases }}
    runs-on: k8s-nano
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find TF releases
        uses: ./.github/actions/find-tf-releases
        id: find
        with:
          count: '1'

  # Run import tests
  # Built once per run and shared with every matrix job below. Building it in
  # each job instead meant one `go build` per test-by-terraform-version
  # combination, all of them producing the same binary.
  build-provider:
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    runs-on: k8s-medium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build provider
        id: build
        run: |
          mkdir -p dist
          go build -o dist/terraform-provider-clickhouse -ldflags='-X github.com/ClickHouse/terraform-provider-clickhouse/internal/project.version=e2e -X github.com/ClickHouse/terraform-provider-clickhouse/internal/project.commit=${{ github.sha }}'
          go env GOOS GOARCH
          echo "artifact=provider-${{ github.run_id }}-${{ github.run_attempt }}" >> "${GITHUB_OUTPUT}"

      - name: Upload provider
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: dist/terraform-provider-clickhouse
          retention-days: 1
          if-no-files-found: error

  import:
    needs: ["token", "find-tf-releases", "build-provider"]
    runs-on: k8s-small
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        tf_release: ${{ fromJSON(needs.find-tf-releases.outputs.releases) }}
        cloud_provider: [ "aws", "azure", "gcp" ]
        test_name : ["generic"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate service name
        uses: ./.github/actions/generate-service-name
        id: service_name
        with:
          test_type: import
          test_name: ${{ matrix.test_name }}
          tf_release: ${{ matrix.tf_release }}
          cloud_provider: ${{ matrix.cloud_provider }}
          token: ${{ needs.token.outputs.token }}

      - name: Get API details for env
        id: credentials
        env:
          api_env: "${{ inputs.api_env }}"
          api_env_production: "${{ secrets.API_ENV_PRODUCTION }}"
          api_env_staging: "${{ secrets.API_ENV_STAGING }}"
          api_env_development: "${{ secrets.API_ENV_DEVELOPMENT }}"
          api_url: "${{ inputs.api_url }}"
          organization_id: "${{ inputs.organization_id }}"
          api_key_id: "${{ inputs.api_key_id }}"
          api_key_secret: "${{ inputs.api_key_secret }}"
        run: |
          bash ./.github/scripts/set_api_env.sh ${{ matrix.cloud_provider }}

      - name: Import
        id: import
        uses: ./.github/actions/import
        with:
          provider_artifact: ${{ needs.build-provider.outputs.artifact }}
          api_url: ${{ steps.credentials.outputs.api_url }}
          organization_id: ${{ steps.credentials.outputs.organization_id }}
          token_key: ${{ steps.credentials.outputs.api_key_id }}
          token_secret: ${{ steps.credentials.outputs.api_key_secret }}
          service_name: ${{steps.service_name.outputs.service_name}}
          tf_release: ${{ matrix.tf_release }}
          cloud_provider: ${{ matrix.cloud_provider }}
          region: ${{ steps.credentials.outputs.region }}


  # Delete any leftover service that might have failed deleting
  cleanup:
    runs-on: k8s-small
    needs: [ "import", "token" ]
    if: always()
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get API details for env
        id: credentials
        env:
          api_env: "${{ inputs.api_env }}"
          api_env_production: "${{ secrets.API_ENV_PRODUCTION }}"
          api_env_staging: "${{ secrets.API_ENV_STAGING }}"
          api_env_development: "${{ secrets.API_ENV_DEVELOPMENT }}"
          api_url: "${{ inputs.api_url }}"
          organization_id: "${{ inputs.organization_id }}"
          api_key_id: "${{ inputs.api_key_id }}"
          api_key_secret: "${{ inputs.api_key_secret }}"
        run: |
          bash ./.github/scripts/set_api_env.sh
      - name: Cleanup ClickHouse
        uses: ./.github/actions/cleanup-clickhouse
        with:
          api_url: ${{ steps.credentials.outputs.api_url }}
          organization_id: ${{ steps.credentials.outputs.organization_id }}
          token_key: ${{ steps.credentials.outputs.api_key_id }}
          token_secret: ${{ steps.credentials.outputs.api_key_secret }}
          token: ${{needs.token.outputs.token}}
