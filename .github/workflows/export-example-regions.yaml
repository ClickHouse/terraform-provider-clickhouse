name: Export example regions

on:
  workflow_dispatch:
    inputs:
      api_env:
        type: choice
        required: true
        default: Production
        options:
          - Production
          - Staging
          - Development
        description: Environment whose existing region lists should be exported.

permissions:
  contents: read

jobs:
  export:
    runs-on: k8s-nano
    environment: default
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Export region lists to the job summary
        shell: bash
        env:
          api_env: ${{ inputs.api_env }}
          API_ENV_PRODUCTION: ${{ secrets.API_ENV_PRODUCTION }}
          API_ENV_STAGING: ${{ secrets.API_ENV_STAGING }}
          API_ENV_DEVELOPMENT: ${{ secrets.API_ENV_DEVELOPMENT }}
        run: |
          secret_name="API_ENV_${api_env^^}"
          config="$(bash .github/scripts/export_example_regions.sh <<< "${!secret_name}")"
          {
            echo "### EXAMPLE_REGIONS_${api_env^^}"
            echo
            echo 'Copy this JSON into the repository Actions variable with the name above.'
            echo
            echo '```json'
            printf '%s\n' "${config}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
